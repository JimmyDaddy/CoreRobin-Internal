version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - "*"
    ignore:
      # Tauri 2 currently depends on the unmaintained GTK3 bindings, which
      # constrain glib to 0.18.x. Remove this exception as soon as Tauri's
      # Linux runtime supports glib >= 0.20.
      - dependency-name: glib
