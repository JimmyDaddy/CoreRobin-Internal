version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      frontend-runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      frontend-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "*"
    ignore:
      # TypeScript 7 is not supported by typescript-eslint 8.x yet. Keeping
      # this as an explicit toolchain gate prevents one incompatible major
      # from blocking every otherwise safe frontend update in a group.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - "*"
    ignore:
      # Tauri 2 currently depends on the unmaintained GTK3 bindings, which
      # constrain glib to 0.18.x. Remove this exception as soon as Tauri's
      # Linux runtime supports glib >= 0.20.
      - dependency-name: glib
