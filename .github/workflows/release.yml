name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLIC_RELEASE_REPOSITORY: JimmyDaddy/corerobin-monitor

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag, versions, and trusted branch ancestry
        run: node scripts/verify-release-source.mjs "$GITHUB_REF_NAME" origin/main

      - name: Check frontend
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm verify:web-bundle
          pnpm test:surface-contracts
          pnpm test:performance-contracts
          pnpm verify:release-tools

      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check Rust backend
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg -- --locked
            artifact: corerobin-macos-aarch64
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg -- --locked
            artifact: corerobin-macos-x86_64
          - label: Linux x64
            os: ubuntu-22.04
            target: ""
            args: --bundles deb,appimage -- --locked
            artifact: corerobin-linux-x86_64
          - label: Windows x64
            os: windows-latest
            target: ""
            args: --bundles nsis,msi -- --locked
            artifact: corerobin-windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Add macOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.target }}

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.target }}-
            release-${{ runner.os }}-

      - name: Build unsigned installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          args: ${{ matrix.args }}
          retryAttempts: 2
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ${{ matrix.artifact }}-[bundle]

      - name: Verify embedded production WebView entries and size budgets
        run: pnpm verify:web-bundle

      - name: Verify packaged macOS app structure, identity, signature, and architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          expected_arch="x86_64"
          case "${{ matrix.target }}" in
            aarch64-*) expected_arch="arm64" ;;
          esac
          bash scripts/verify-packaged-macos.sh \
            "src-tauri/target/${{ matrix.target }}/release/bundle" \
            "$expected_arch" \
            "com.corerobin.monitor"

      - name: Verify packaged Linux installer structure and architecture
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/verify-packaged-linux.sh src-tauri/target/release/bundle

      - name: Verify packaged Windows installer structure and architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-packaged-windows.ps1 -BundleRoot src-tauri/target/release/bundle

  package:
    name: Package release evidence
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: corerobin-*
          path: release-artifacts

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-artifacts
          format: spdx-json
          output-file: release-artifacts/corerobin.spdx.json
          artifact-name: corerobin.spdx.json
          syft-version: v1.46.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          find release-artifacts -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-artifacts/SHA256SUMS
          sha256sum --check release-artifacts/SHA256SUMS

      - name: Upload release-ready artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ready-${{ github.sha }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign release checksum manifest
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release-ready artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ready-${{ github.sha }}
          path: release-artifacts

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify checksum manifest
        shell: bash
        run: |
          cosign sign-blob \
            --yes \
            --bundle release-artifacts/SHA256SUMS.sigstore.json \
            release-artifacts/SHA256SUMS
          cosign verify-blob \
            --bundle release-artifacts/SHA256SUMS.sigstore.json \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release-artifacts/SHA256SUMS

      - name: Upload signed release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed-${{ github.sha }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Stage public draft release
    needs: sign
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
    steps:
      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download signed release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed-${{ github.sha }}
          path: release-artifacts

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Render release notes from changelog
        run: node scripts/render-release-notes.mjs "$GITHUB_REF_NAME" --output release-notes.md

      - name: Verify checksums and signature
        shell: bash
        run: |
          sha256sum --check release-artifacts/SHA256SUMS
          cosign verify-blob \
            --bundle release-artifacts/SHA256SUMS.sigstore.json \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release-artifacts/SHA256SUMS

      - name: Verify public release credential
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "PUBLIC_RELEASE_TOKEN is required to publish to $PUBLIC_RELEASE_REPOSITORY" >&2
            exit 1
          fi

      - name: Create or update public draft release
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-artifacts -type f -print0 | sort -z)
          if gh release view "$GITHUB_REF_NAME" --repo "$PUBLIC_RELEASE_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft --repo "$PUBLIC_RELEASE_REPOSITORY")" = "true"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --clobber \
              --repo "$PUBLIC_RELEASE_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --draft \
              --target main \
              --title "CoreRobin $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --repo "$PUBLIC_RELEASE_REPOSITORY"
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --repo "$PUBLIC_RELEASE_REPOSITORY"
