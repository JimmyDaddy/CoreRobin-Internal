name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      macos_builder:
        description: Submit GitHub-hosted macOS builds asynchronously, or import an explicitly prepared local build
        required: true
        default: github
        type: choice
        options:
          - local
          - github

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLIC_RELEASE_REPOSITORY: JimmyDaddy/corerobin-monitor

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag, versions, and trusted branch ancestry
        run: node scripts/verify-release-source.mjs "$GITHUB_REF_NAME" origin/main

      - name: Check frontend
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm verify:web-bundle
          pnpm test:surface-contracts
          pnpm test:performance-contracts
          pnpm verify:release-tools

      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: release-verify

      - name: Check Rust backend
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-22.04
            target: ""
            args: --bundles deb,appimage -- --locked
            artifact: corerobin-linux-x86_64
            updater_signature_path: src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - label: Windows x64
            os: windows-latest
            target: ""
            args: --bundles nsis,msi -- --locked
            artifact: corerobin-windows-x86_64
            updater_signature_path: src-tauri/target/release/bundle/nsis/*-setup.exe.sig
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: release-build

      - name: Verify updater signing credential
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Build non-macOS installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          args: ${{ matrix.args }}
          retryAttempts: 2
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ${{ matrix.artifact }}-[bundle]-[ext]

      - name: Upload updater signature explicitly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}-updater-signature
          path: ${{ matrix.updater_signature_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Verify embedded production WebView entries and size budgets
        run: pnpm verify:web-bundle

      - name: Verify packaged Linux installer structure and architecture
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/verify-packaged-linux.sh src-tauri/target/release/bundle

      - name: Verify packaged Windows installer structure and architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-packaged-windows.ps1 -BundleRoot src-tauri/target/release/bundle

  build_macos_github:
    name: Build ${{ matrix.label }} on GitHub
    if: github.event_name == 'push' || inputs.macos_builder == 'github'
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            target: aarch64-apple-darwin
            expected_arch: arm64
            public_arch: aarch64
            artifact: corerobin-macos-aarch64
          - label: macOS Intel
            target: x86_64-apple-darwin
            expected_arch: x86_64
            public_arch: x64
            artifact: corerobin-macos-x86_64
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Add macOS Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: release-macos-${{ matrix.target }}

      - name: Verify updater signing credential
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Prepare Apple signing and notarization credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_PRIVATE_KEY_BASE64"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_TEAM_ID"

          notary_key_dir="$RUNNER_TEMP/corerobin-notary"
          notary_key_path="$notary_key_dir/AuthKey_${APPLE_API_KEY}.p8"
          mkdir -m 700 "$notary_key_dir"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D > "$notary_key_path"
          chmod 600 "$notary_key_path"
          openssl pkey -in "$notary_key_path" -noout
          printf 'COREROBIN_NOTARY_KEY_PATH=%s\n' "$notary_key_path" >> "$GITHUB_ENV"

      - name: Build Developer ID signed macOS installer and updater
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --bundles app,dmg -- --locked
          retryAttempts: 2
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: false

      - name: Submit macOS DMG for asynchronous notarization
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_WEBHOOK_URL: ${{ secrets.APPLE_NOTARY_WEBHOOK_URL }}
        run: |
          shopt -s nullglob
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          dmgs=("$bundle_root/dmg/"*.dmg)
          updater_packages=("$bundle_root/macos/"*.app.tar.gz)
          updater_signatures=("$bundle_root/macos/"*.app.tar.gz.sig)
          test "${#dmgs[@]}" -eq 1
          test "${#updater_packages[@]}" -eq 1
          test "${#updater_signatures[@]}" -eq 1
          test -s "$COREROBIN_NOTARY_KEY_PATH"

          json_field() {
            node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync(0, "utf8"))[process.argv[1]];
              if (typeof value !== "string" || value.length === 0) process.exit(1);
              process.stdout.write(value);
            ' "$1"
          }

          submit_args=("${dmgs[0]}" \
            --key "$COREROBIN_NOTARY_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json)
          if [[ -n "$APPLE_NOTARY_WEBHOOK_URL" ]]; then
            separator='?'
            [[ "$APPLE_NOTARY_WEBHOOK_URL" == *\?* ]] && separator='&'
            callback_url="${APPLE_NOTARY_WEBHOOK_URL}${separator}tag=${GITHUB_REF_NAME}&run_id=${GITHUB_RUN_ID}&arch=${{ matrix.public_arch }}"
            submit_args+=(--webhook "$callback_url")
          else
            echo "::warning::APPLE_NOTARY_WEBHOOK_URL is not configured; scheduled notarization reconciliation will provide the fallback wake-up."
          fi

          submission_json=$(xcrun notarytool submit "${submit_args[@]}")
          submission_id=$(printf '%s' "$submission_json" | json_field id)
          echo "Apple notarization submission: $submission_id"
          version="${GITHUB_REF_NAME#v}"
          state_path="$bundle_root/CoreRobin_${version}_${{ matrix.public_arch }}_notarization.json"
          node scripts/macos-notarization-state.mjs create \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" \
            "${{ matrix.target }}" \
            "${{ matrix.public_arch }}" \
            "${{ matrix.expected_arch }}" \
            "$APPLE_TEAM_ID" \
            "$submission_id" \
            "$bundle_root" \
            "$state_path"

      - name: Verify embedded production WebView entries and size budgets
        run: pnpm verify:web-bundle

      - name: Verify signed Preview app structure, identity, and architecture
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bash scripts/verify-packaged-macos.sh \
            "src-tauri/target/${{ matrix.target }}/release/bundle" \
            "${{ matrix.expected_arch }}" \
            "com.corerobin.monitor" \
            "$APPLE_TEAM_ID" \
            signed-preview

      - name: Upload pre-staple macOS installer, updater, and notarization state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/*_notarization.json
          if-no-files-found: error
          retention-days: 30

  import_macos_local:
    name: Import locally notarized macOS assets
    if: github.event_name == 'workflow_dispatch' && inputs.macos_builder == 'local'
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_READ_TOKEN }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify read-only public draft credential
        shell: bash
        run: test -n "$GH_TOKEN"

      - name: Download and verify locally built macOS assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest="CoreRobin_${version}_macos-local.json"
          assets=(
            "CoreRobin_${version}_aarch64.dmg"
            "CoreRobin_${version}_aarch64.app.tar.gz"
            "CoreRobin_${version}_aarch64.app.tar.gz.sig"
            "CoreRobin_${version}_x64.dmg"
            "CoreRobin_${version}_x64.app.tar.gz"
            "CoreRobin_${version}_x64.app.tar.gz.sig"
            "$manifest"
          )

          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft --repo "$PUBLIC_RELEASE_REPOSITORY")" = "true"
          mkdir -p imported-macos/all imported-macos/aarch64 imported-macos/x86_64
          for asset in "${assets[@]}"; do
            gh release download "$GITHUB_REF_NAME" \
              --repo "$PUBLIC_RELEASE_REPOSITORY" \
              --dir imported-macos/all \
              --pattern "$asset"
          done
          node scripts/local-macos-release-manifest.mjs verify \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            imported-macos/all
          cp imported-macos/all/*_aarch64.dmg imported-macos/all/*_aarch64.app.tar.gz* imported-macos/aarch64/
          cp imported-macos/all/*_x64.dmg imported-macos/all/*_x64.app.tar.gz* imported-macos/x86_64/

      - name: Upload local macOS Apple Silicon artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corerobin-macos-aarch64
          path: imported-macos/aarch64
          if-no-files-found: error
          retention-days: 14

      - name: Upload local macOS Intel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corerobin-macos-x86_64
          path: imported-macos/x86_64
          if-no-files-found: error
          retention-days: 14

      - name: Upload local macOS build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corerobin-macos-local-evidence
          path: imported-macos/all/CoreRobin_*_macos-local.json
          if-no-files-found: error
          retention-days: 14

  preview:
    name: Publish manual-download Preview prerelease
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        needs.build_macos_github.result == 'success'
      }}
    needs:
      - build
      - build_macos_github
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
      APPLE_NOTARY_WEBHOOK_URL: ${{ secrets.APPLE_NOTARY_WEBHOOK_URL }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed installers from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: corerobin-*
          path: preview-source

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Prepare manual-download Preview assets
        run: |
          node scripts/prepare-preview-assets.mjs "$GITHUB_REF_NAME" preview-source preview-assets
          node scripts/render-preview-release-notes.mjs "$GITHUB_REF_NAME" preview-release-notes.md
          (cd preview-assets && sha256sum --check PREVIEW-SHA256SUMS)
          test ! -e preview-assets/latest.json
          test -z "$(find preview-assets -type f \( -name '*.tar.gz' -o -name '*.sig' \) -print -quit)"

      - name: Publish immutable Preview channel candidate
        shell: bash
        run: |
          test -n "$GH_TOKEN"
          preview_tag="${GITHUB_REF_NAME}-preview.1"
          if gh release view "$preview_tag" --repo "$PUBLIC_RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace already-published Preview release: $preview_tag" >&2
            exit 1
          fi
          mapfile -d '' assets < <(find preview-assets -type f -print0 | sort -z)
          gh release create "$preview_tag" "${assets[@]}" \
            --prerelease \
            --latest=false \
            --target main \
            --title "CoreRobin ${GITHUB_REF_NAME} Preview (未公证)" \
            --notes-file preview-release-notes.md \
            --repo "$PUBLIC_RELEASE_REPOSITORY"

      - name: Notify notarization coordinator that Preview is ready
        shell: bash
        run: |
          if [[ -z "$APPLE_NOTARY_WEBHOOK_URL" ]]; then
            echo "::warning::APPLE_NOTARY_WEBHOOK_URL is not configured; use Finalize macOS release manually."
            exit 0
          fi
          separator='?'
          [[ "$APPLE_NOTARY_WEBHOOK_URL" == *\?* ]] && separator='&'
          callback_url="${APPLE_NOTARY_WEBHOOK_URL}${separator}tag=${GITHUB_REF_NAME}&run_id=${GITHUB_RUN_ID}&signal=preview_ready"
          if ! curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --request POST \
            --header 'content-type: application/json' \
            --data '{}' \
            "$callback_url"; then
            echo "::warning::Could not notify the notarization coordinator; use Finalize macOS release manually."
          fi

  package:
    name: Package release evidence
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        needs.import_macos_local.result == 'success'
      }}
    needs:
      - build
      - build_macos_github
      - import_macos_local
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: corerobin-*
          path: release-artifacts

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Render structured user release notes
        run: node scripts/render-release-notes.mjs "$GITHUB_REF_NAME" --output release-notes.md

      - name: Generate signed updater manifest
        shell: bash
        run: |
          pub_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          node scripts/generate-updater-manifest.mjs \
            "$GITHUB_REF_NAME" \
            release-artifacts \
            release-notes.md \
            "$pub_date"
          test -s release-artifacts/latest.json

      - name: Prepare uniquely named public assets
        run: node scripts/flatten-release-artifacts.mjs release-artifacts

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-artifacts
          format: spdx-json
          output-file: release-artifacts/corerobin.spdx.json
          artifact-name: corerobin.spdx.json
          syft-version: v1.46.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          cd release-artifacts
          checksum_file="$RUNNER_TEMP/corerobin-SHA256SUMS"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$checksum_file"
          mv "$checksum_file" SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload release-ready artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ready-${{ github.sha }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign release checksum manifest
    if: ${{ always() && !cancelled() && needs.package.result == 'success' }}
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release-ready artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ready-${{ github.sha }}
          path: release-artifacts

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify checksum manifest
        shell: bash
        run: |
          cosign sign-blob \
            --yes \
            --bundle release-artifacts/SHA256SUMS.sigstore.json \
            release-artifacts/SHA256SUMS
          cosign verify-blob \
            --bundle release-artifacts/SHA256SUMS.sigstore.json \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release-artifacts/SHA256SUMS

      - name: Upload signed release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed-${{ github.sha }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Stage public draft release
    if: ${{ always() && !cancelled() && needs.sign.result == 'success' }}
    needs: sign
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed-${{ github.sha }}
          path: release-artifacts

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Render structured user release notes
        run: node scripts/render-release-notes.mjs "$GITHUB_REF_NAME" --output release-notes.md

      - name: Verify checksums and signature
        shell: bash
        run: |
          (cd release-artifacts && sha256sum --check SHA256SUMS)
          cosign verify-blob \
            --bundle release-artifacts/SHA256SUMS.sigstore.json \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release-artifacts/SHA256SUMS

      - name: Verify public release credential
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "PUBLIC_RELEASE_TOKEN is required to publish to $PUBLIC_RELEASE_REPOSITORY" >&2
            exit 1
          fi

      - name: Create or update public draft release
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-artifacts -type f -print0 | sort -z)
          if gh release view "$GITHUB_REF_NAME" --repo "$PUBLIC_RELEASE_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft --repo "$PUBLIC_RELEASE_REPOSITORY")" = "true"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --clobber \
              --repo "$PUBLIC_RELEASE_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --draft \
              --target main \
              --title "CoreRobin $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --repo "$PUBLIC_RELEASE_REPOSITORY"
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --repo "$PUBLIC_RELEASE_REPOSITORY"

      - name: Verify staged public draft release
        shell: bash
        run: |
          release_id="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$PUBLIC_RELEASE_REPOSITORY" \
            --json databaseId \
            --jq .databaseId)"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          release_json="$(gh api "repos/$PUBLIC_RELEASE_REPOSITORY/releases/$release_id")"
          test "$(jq -r .tag_name <<<"$release_json")" = "$GITHUB_REF_NAME"
          test "$(jq -r .draft <<<"$release_json")" = "true"
          test "$(jq -r .prerelease <<<"$release_json")" = "false"

          find release-artifacts -maxdepth 1 -type f -exec basename {} \; \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-release-assets"
          jq -r '.assets[].name' <<<"$release_json" \
            | LC_ALL=C sort > "$RUNNER_TEMP/staged-release-assets"
          diff -u "$RUNNER_TEMP/expected-release-assets" "$RUNNER_TEMP/staged-release-assets"

          release_url="$(jq -r .html_url <<<"$release_json")"
          {
            echo "### Public draft staged"
            echo
            echo "- Tag: \`$GITHUB_REF_NAME\`"
            echo "- Draft: $release_url"
            echo "- Assets: $(wc -l < "$RUNNER_TEMP/staged-release-assets" | tr -d ' ')"
            echo "- Next gate: real-device smoke evidence, then Promote verified release"
          } >> "$GITHUB_STEP_SUMMARY"

  verify_completion:
    name: Verify release stage completed
    if: ${{ always() && !cancelled() }}
    needs:
      - verify
      - build
      - build_macos_github
      - import_macos_local
      - preview
      - package
      - sign
      - publish
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERIFY_RESULT: ${{ needs.verify.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      HOSTED_MACOS_RESULT: ${{ needs.build_macos_github.result }}
      LOCAL_MACOS_RESULT: ${{ needs.import_macos_local.result }}
      PREVIEW_RESULT: ${{ needs.preview.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
      SIGN_RESULT: ${{ needs.sign.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      USE_HOSTED_MACOS: ${{ github.event_name == 'push' || inputs.macos_builder == 'github' }}
    steps:
      - name: Fail closed unless the selected release stage completed
        shell: bash
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          if [[ "$USE_HOSTED_MACOS" == "true" ]]; then
            test "$HOSTED_MACOS_RESULT" = "success"
            test "$PREVIEW_RESULT" = "success"
            echo "Hosted release reached the public Preview and asynchronous notarization stage." >> "$GITHUB_STEP_SUMMARY"
          else
            test "$LOCAL_MACOS_RESULT" = "success"
            test "$PACKAGE_RESULT" = "success"
            test "$SIGN_RESULT" = "success"
            test "$PUBLISH_RESULT" = "success"
            echo "Local-macOS release reached the finalized public draft stage." >> "$GITHUB_STEP_SUMMARY"
          fi
