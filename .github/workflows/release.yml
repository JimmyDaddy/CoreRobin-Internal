name: Release
run-name: Release CoreRobin ${{ github.event_name == 'push' && github.ref_name || (inputs.version != '' && format('v{0}', inputs.version) || 'from main') }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional MAJOR.MINOR.PATCH version (defaults to package.json on main)
        required: false
        type: string
      publish_mode:
        description: Publish directly as Latest after approval, or stop at a public draft
        required: true
        default: latest
        type: choice
        options:
          - latest
          - draft
      macos_builder:
        description: Build & notarize macOS on GitHub (default), or import an explicitly prepared local build
        required: true
        default: github
        type: choice
        options:
          - github
          - local

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLIC_RELEASE_REPOSITORY: JimmyDaddy/corerobin-monitor

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      publish_mode: ${{ steps.source.outputs.publish_mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify trusted release source
        id: source
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_MODE: ${{ inputs.publish_mode }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_version="${release_tag#v}"
            node scripts/verify-release-source.mjs "$release_tag" origin/main
            publish_mode="latest"
          else
            test "$GITHUB_REF" = "refs/heads/main"
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            package_version="$(node -p 'require("./package.json").version')"
            release_version="${INPUT_VERSION:-$package_version}"
            [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$release_version" = "$package_version"
            release_tag="v${release_version}"
            node scripts/verify-release-readiness.mjs
            publish_mode="${INPUT_PUBLISH_MODE:-latest}"
          fi
          commit="$(git rev-parse HEAD)"
          {
            echo "tag=$release_tag"
            echo "version=$release_version"
            echo "commit=$commit"
            echo "publish_mode=$publish_mode"
          } >> "$GITHUB_OUTPUT"
          echo "Verified release $release_tag at $commit (publish_mode=$publish_mode)."

      - name: Install Linux system dependencies
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend and release readiness
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm verify:web-bundle
          pnpm test:surface-contracts
          pnpm test:performance-contracts
          pnpm verify:release-tools

      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: release-verify

      - name: Check Rust backend
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-22.04
            args: --bundles deb,appimage -- --locked
            artifact: corerobin-linux-x86_64
            updater_signature_path: src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - label: Windows x64
            os: windows-latest
            args: --bundles nsis,msi -- --locked
            artifact: corerobin-windows-x86_64
            updater_signature_path: src-tauri/target/release/bundle/nsis/*-setup.exe.sig
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci-apt-update.sh
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: release-build

      - name: Verify updater signing credential
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Build non-macOS installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          args: ${{ matrix.args }}
          retryAttempts: 2
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ${{ matrix.artifact }}-[bundle]-[ext]

      - name: Upload updater signature explicitly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}-updater-signature
          path: ${{ matrix.updater_signature_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Verify embedded production WebView entries and size budgets
        run: pnpm verify:web-bundle

      - name: Verify packaged Linux installer structure and architecture
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/verify-packaged-linux.sh src-tauri/target/release/bundle

      - name: Verify packaged Windows installer structure and architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-packaged-windows.ps1 -BundleRoot src-tauri/target/release/bundle

  build_macos_github:
    name: Build and notarize ${{ matrix.label }}
    if: github.event_name == 'push' || inputs.macos_builder == 'github'
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            target: aarch64-apple-darwin
            expected_arch: arm64
            artifact: corerobin-macos-aarch64
          - label: macOS Intel
            target: x86_64-apple-darwin
            expected_arch: x86_64
            artifact: corerobin-macos-x86_64
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Add macOS Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: release-macos-${{ matrix.target }}

      - name: Verify updater signing credential
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Prepare Apple signing and notarization credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_PRIVATE_KEY_BASE64"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_TEAM_ID"

          notary_key_dir="$RUNNER_TEMP/corerobin-notary"
          notary_key_path="$notary_key_dir/AuthKey_${APPLE_API_KEY}.p8"
          mkdir -m 700 "$notary_key_dir"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D > "$notary_key_path"
          chmod 600 "$notary_key_path"
          openssl pkey -in "$notary_key_path" -noout
          printf 'COREROBIN_NOTARY_KEY_PATH=%s\n' "$notary_key_path" >> "$GITHUB_ENV"

      - name: Build Developer ID signed macOS installer and updater
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --bundles app,dmg -- --locked
          retryAttempts: 2
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: false

      - name: Notarize and staple macOS DMG
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          dmgs=("$bundle_root/dmg/"*.dmg)
          updater_packages=("$bundle_root/macos/"*.app.tar.gz)
          updater_signatures=("$bundle_root/macos/"*.app.tar.gz.sig)
          test "${#dmgs[@]}" -eq 1
          test "${#updater_packages[@]}" -eq 1
          test "${#updater_signatures[@]}" -eq 1
          test -s "$COREROBIN_NOTARY_KEY_PATH"

          submit_json="$(xcrun notarytool submit "${dmgs[0]}" \
            --key "$COREROBIN_NOTARY_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 25m \
            --output-format json)"
          submission_id="$(jq -r '.id // empty' <<<"$submit_json")"
          status="$(jq -r '.status // empty' <<<"$submit_json")"
          echo "Apple notarization submission ${submission_id}: ${status}"
          if [[ "$status" != "Accepted" ]]; then
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --key "$COREROBIN_NOTARY_KEY_PATH" \
                --key-id "$APPLE_API_KEY" \
                --issuer "$APPLE_API_ISSUER" || true
            fi
            echo "Apple notarization did not reach Accepted (status=${status:-unknown})." >&2
            exit 1
          fi

          xcrun stapler staple "${dmgs[0]}"

      - name: Verify embedded production WebView entries and size budgets
        run: pnpm verify:web-bundle

      - name: Verify notarized macOS app structure, identity, and Gatekeeper
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bash scripts/verify-packaged-macos.sh \
            "src-tauri/target/${{ matrix.target }}/release/bundle" \
            "${{ matrix.expected_arch }}" \
            "com.corerobin.monitor" \
            "$APPLE_TEAM_ID" \
            notarized

      - name: Upload notarized macOS installer and updater
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14

  import_macos_local:
    name: Import locally notarized macOS assets
    if: github.event_name == 'workflow_dispatch' && inputs.macos_builder == 'local'
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_READ_TOKEN }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Verify read-only public draft credential
        shell: bash
        run: test -n "$GH_TOKEN"

      - name: Download and verify locally built macOS assets
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          manifest="CoreRobin_${version}_macos-local.json"
          assets=(
            "CoreRobin_${version}_aarch64.dmg"
            "CoreRobin_${version}_aarch64.app.tar.gz"
            "CoreRobin_${version}_aarch64.app.tar.gz.sig"
            "CoreRobin_${version}_x64.dmg"
            "CoreRobin_${version}_x64.app.tar.gz"
            "CoreRobin_${version}_x64.app.tar.gz.sig"
            "$manifest"
          )

          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft --repo "$PUBLIC_RELEASE_REPOSITORY")" = "true"
          mkdir -p imported-macos/all imported-macos/aarch64 imported-macos/x86_64
          for asset in "${assets[@]}"; do
            gh release download "$RELEASE_TAG" \
              --repo "$PUBLIC_RELEASE_REPOSITORY" \
              --dir imported-macos/all \
              --pattern "$asset"
          done
          node scripts/local-macos-release-manifest.mjs verify \
            "$RELEASE_TAG" \
            "$RELEASE_COMMIT" \
            imported-macos/all
          cp imported-macos/all/*_aarch64.dmg imported-macos/all/*_aarch64.app.tar.gz* imported-macos/aarch64/
          cp imported-macos/all/*_x64.dmg imported-macos/all/*_x64.app.tar.gz* imported-macos/x86_64/

      - name: Upload local macOS Apple Silicon artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corerobin-macos-aarch64
          path: imported-macos/aarch64
          if-no-files-found: error
          retention-days: 14

      - name: Upload local macOS Intel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corerobin-macos-x86_64
          path: imported-macos/x86_64
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package release assets and manifests
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.build.result == 'success' &&
        (needs.build_macos_github.result == 'success' || needs.import_macos_local.result == 'success')
      }}
    needs:
      - verify
      - build
      - build_macos_github
      - import_macos_local
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download signed installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: corerobin-*
          path: release-artifacts

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Render structured user release notes
        run: node scripts/render-release-notes.mjs "$RELEASE_TAG" --output release-notes.md

      - name: Generate signed updater manifest
        shell: bash
        run: |
          pub_date="$(git show -s --format=%cI "$RELEASE_COMMIT")"
          node scripts/generate-updater-manifest.mjs \
            "$RELEASE_TAG" \
            release-artifacts \
            release-notes.md \
            "$pub_date"
          test -s release-artifacts/latest.json

      - name: Prepare uniquely named public assets
        run: node scripts/flatten-release-artifacts.mjs release-artifacts

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-artifacts
          format: spdx-json
          output-file: release-artifacts/corerobin.spdx.json
          artifact-name: corerobin.spdx.json
          syft-version: v1.46.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          cd release-artifacts
          checksum_file="$RUNNER_TEMP/corerobin-SHA256SUMS"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$checksum_file"
          mv "$checksum_file" SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload release-ready artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ready-${{ needs.verify.outputs.commit }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign release checksum manifest
    if: ${{ always() && !cancelled() && needs.package.result == 'success' }}
    needs:
      - verify
      - package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release-ready artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ready-${{ needs.verify.outputs.commit }}
          path: release-artifacts

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify checksum manifest
        shell: bash
        run: |
          cosign sign-blob \
            --yes \
            --bundle release-artifacts/SHA256SUMS.sigstore.json \
            release-artifacts/SHA256SUMS
          cosign verify-blob \
            --bundle release-artifacts/SHA256SUMS.sigstore.json \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release-artifacts/SHA256SUMS

      - name: Upload signed release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed-${{ needs.verify.outputs.commit }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish public release
    if: ${{ always() && !cancelled() && needs.sign.result == 'success' }}
    needs:
      - verify
      - sign
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
      PUBLISH_MODE: ${{ needs.verify.outputs.publish_mode }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Download signed release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed-${{ needs.verify.outputs.commit }}
          path: release-artifacts

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Render structured user release notes
        run: node scripts/render-release-notes.mjs "$RELEASE_TAG" --output release-notes.md

      - name: Verify checksums and signature
        shell: bash
        run: |
          (cd release-artifacts && sha256sum --check SHA256SUMS)
          cosign verify-blob \
            --bundle release-artifacts/SHA256SUMS.sigstore.json \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release-artifacts/SHA256SUMS

      - name: Ensure immutable release tag on internal repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ensure-stable-release-tag.sh

      - name: Create or update public release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "PUBLIC_RELEASE_TOKEN is required to publish to $PUBLIC_RELEASE_REPOSITORY" >&2
            exit 1
          fi
          mapfile -d '' assets < <(find release-artifacts -type f -print0 | sort -z)
          if gh release view "$RELEASE_TAG" --repo "$PUBLIC_RELEASE_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft --repo "$PUBLIC_RELEASE_REPOSITORY")" = "true"
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --clobber \
              --repo "$PUBLIC_RELEASE_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --draft \
              --target main \
              --title "CoreRobin $RELEASE_TAG" \
              --notes-file release-notes.md \
              --repo "$PUBLIC_RELEASE_REPOSITORY"
          fi
          gh release edit "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --repo "$PUBLIC_RELEASE_REPOSITORY"

          release_id="$(gh release view "$RELEASE_TAG" \
            --repo "$PUBLIC_RELEASE_REPOSITORY" \
            --json databaseId \
            --jq .databaseId)"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          release_json="$(gh api "repos/$PUBLIC_RELEASE_REPOSITORY/releases/$release_id")"
          test "$(jq -r .tag_name <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r .prerelease <<<"$release_json")" = "false"

          find release-artifacts -maxdepth 1 -type f -exec basename {} \; \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-release-assets"
          jq -r '.assets[].name' <<<"$release_json" \
            | LC_ALL=C sort > "$RUNNER_TEMP/staged-release-assets"
          diff -u "$RUNNER_TEMP/expected-release-assets" "$RUNNER_TEMP/staged-release-assets"

      - name: Validate and publish public website release data
        if: needs.verify.outputs.publish_mode == 'latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/update-public-release-manifest.mjs "$RELEASE_TAG" "$PUBLIC_RELEASE_REPOSITORY" --check
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest \
            --repo "$PUBLIC_RELEASE_REPOSITORY"
          node scripts/update-public-release-manifest.mjs "$RELEASE_TAG" "$PUBLIC_RELEASE_REPOSITORY"

      - name: Write release summary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          release_url="$(gh release view "$RELEASE_TAG" --repo "$PUBLIC_RELEASE_REPOSITORY" --json url --jq .url)"
          {
            echo "### CoreRobin $RELEASE_TAG ($PUBLISH_MODE)"
            echo
            echo "- Release: $release_url"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Assets verified against \`SHA256SUMS\` and Sigstore."
          } >> "$GITHUB_STEP_SUMMARY"
