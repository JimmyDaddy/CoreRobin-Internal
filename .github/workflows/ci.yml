name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
    steps:
      - name: Check out repository for git-based events
        if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'index.html'
              - 'splash.html'
              - 'tray.html'
              - 'companion.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'eslint.config.*'
              - 'i18next.config.*'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.github/actions/**'
            desktop:
              - 'src-tauri/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
              - '.github/actions/**'

      - name: Summarize selected scopes
        env:
          FRONTEND: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
          DESKTOP: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
        run: |
          {
            echo "## CI change scope"
            echo
            echo "| Scope | Selected |"
            echo "| --- | --- |"
            echo "| Frontend | $FRONTEND |"
            echo "| Desktop | $DESKTOP |"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend quality
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Check out repository
        if: needs.changes.result == 'success'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: needs.changes.result == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        run: pnpm lint

      - name: Type-check
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        run: pnpm typecheck

      - name: Test
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        run: pnpm test

      - name: Build web assets
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        run: pnpm build

      - name: Verify production WebView entries and size budgets
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        run: pnpm verify:web-bundle

      - name: Verify cross-surface state contracts
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        run: pnpm test:surface-contracts

      - name: Verify stable performance contracts
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        run: pnpm test:performance-contracts

      - name: Validate release smoke and performance tools
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        run: pnpm verify:release-tools

  desktop-ubuntu:
    name: Desktop (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.desktop == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Check out repository
        if: needs.changes.result == 'success'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run desktop quality checks
        if: needs.changes.result == 'success'
        uses: ./.github/actions/desktop-quality

  desktop-macos:
    name: Desktop (macos-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.desktop == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Check out repository
        if: needs.changes.result == 'success'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run desktop quality checks
        if: needs.changes.result == 'success'
        uses: ./.github/actions/desktop-quality

  desktop-windows:
    name: Desktop (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.desktop == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Check out repository
        if: needs.changes.result == 'success'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run desktop quality checks
        if: needs.changes.result == 'success'
        uses: ./.github/actions/desktop-quality
